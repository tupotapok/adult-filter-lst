name: Generate Clean Domain List
on:
  schedule:
    - cron: '0 3 * * *' # Автоматический запуск каждый день в 03:00
  workflow_dispatch: # Кнопка для ручного запуска

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Download and clean list
        run: |
          curl -sL "https://raw.githubusercontent.com/MetaCubeX/meta-rules-dat/meta/geo/geosite/category-porn.list" | sed -E 's/^([+*]\.)//' > porn.lst
          
      - name: Commit changes
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add porn.lst
          git diff --quiet && git diff --staged --quiet || (git commit -m "Update clean porn.lst" && git push)
